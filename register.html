<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>Register — H24 ONLINE</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app" v-cloak>
  <div style="display:flex;flex-direction:column;height:100vh;">
    <header class="app-header">
      <div style="padding:14px 16px;display:flex;align-items:center;gap:12px;">
        <a href="login.html" style="background:var(--surface2);border:none;border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);text-decoration:none;">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div style="font-weight:800;font-size:17px;">Create Account</div>
      </div>
    </header>
    <main style="padding:16px;padding-bottom:40px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;">
        <button @click="handleGoogleLogin" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:#fff;font-size:14px;font-weight:600;margin-bottom:20px;" class="card-hover">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" style="width:20px;"> Sign up with Google
        </button>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <div style="flex:1;height:1px;background:var(--border);"></div>
          <span style="font-size:12px;color:var(--text-dim);">or sign up with email</span>
          <div style="flex:1;height:1px;background:var(--border);"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <input v-model="regName" type="text" class="input-field" placeholder="Full Name">
          <input v-model="regPhone" type="tel" class="input-field" placeholder="Phone Number">
          <input v-model="regEmail" type="email" class="input-field" placeholder="Email Address">
          <input v-model="regPass" type="password" class="input-field" placeholder="Password">
          <input v-model="regConfirm" type="password" class="input-field"
            :style="{borderColor:regPass&&regConfirm&&regPass!==regConfirm?'var(--red)':'var(--border)'}"
            placeholder="Confirm Password">
          <div v-if="regPass&&regConfirm&&regPass!==regConfirm" style="font-size:12px;color:#f87171;margin-top:-4px;">Passwords do not match!</div>
        </div>
        <div style="margin-top:12px;">
          <input v-model="regReferralCode" type="text" class="input-field" placeholder="Referral Code (optional)" style="font-size:13px;">
        </div>
        <div v-if="errorMsg" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px;font-size:13px;color:#f87171;margin-top:14px;">{{ errorMsg }}</div>
        <button @click="handleRegister" class="btn-primary" style="width:100%;margin-top:20px;" :disabled="regLoading">
          <span v-if="regLoading" class="spinner"></span>
          <span v-else>Create Account</span>
        </button>
        <p style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:16px;">
          Already a member? <a href="login.html" style="color:var(--primary);font-weight:700;text-decoration:none;">Login</a>
        </p>
      </div>
    </main>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, updateProfile, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { createApp, ref } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZWRcCP0hXTkfQoRhqxczgdD6cw5kp39c",
  authDomain: "h24-online.firebaseapp.com",
  projectId: "h24-online",
  storageBucket: "h24-online.firebasestorage.app",
  messagingSenderId: "808524719613",
  appId: "1:808524719613:web:7f1abe9e70a346c3376594"
};
const fireApp = initializeApp(firebaseConfig);
const auth = getAuth(fireApp);
setPersistence(auth, browserLocalPersistence).catch(() => {});
const db = getFirestore(fireApp);

createApp({
  setup() {
    const regName = ref(''); const regPhone = ref(''); const regEmail = ref('');
    const regPass = ref(''); const regConfirm = ref(''); const regLoading = ref(false);
    const regReferralCode = ref('');
    const errorMsg = ref('');
    const urlRef = new URLSearchParams(window.location.search).get('ref');
    if (urlRef) regReferralCode.value = urlRef;

    const handleGoogleLogin = async () => {
      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const userRef = doc(db, 'users', user.uid);
        const snap = await getDoc(userRef);
        if (!snap.exists()) {
          await setDoc(userRef, {
            uid: user.uid, name: user.displayName||'User', email: user.email,
            photoURL: user.photoURL||'', balance: 0, phone: '',
            referralCode: user.uid.substring(0, 8), joinedAt: new Date().toISOString(),
            lastSeen: serverTimestamp(), isOnline: true
          });
        }
        localStorage.setItem('userId', user.uid);
        window.location.href = 'index.html';
      } catch (e) { errorMsg.value = 'Google login failed: ' + e.message; }
    };

    const handleRegister = async () => {
      if (!regName.value || !regEmail.value || !regPass.value) { errorMsg.value = 'সব field পূরণ করুন।'; return; }
      if (regPass.value !== regConfirm.value) { errorMsg.value = 'Passwords match করছে না।'; return; }
      if (regPass.value.length < 6) { errorMsg.value = 'Password কমপক্ষে ৬ character হতে হবে।'; return; }
      regLoading.value = true; errorMsg.value = '';
      try {
        const result = await createUserWithEmailAndPassword(auth, regEmail.value, regPass.value);
        await updateProfile(result.user, { displayName: regName.value });
        const uid = result.user.uid;
        await setDoc(doc(db, 'users', uid), {
          uid, name: regName.value, email: regEmail.value,
          phone: regPhone.value, balance: 0, photoURL: '',
          referralCode: uid.substring(0, 8),
          referredBy: regReferralCode.value || '',
          joinedAt: new Date().toISOString(),
          lastSeen: serverTimestamp(), isOnline: true
        });
        if (regReferralCode.value) {
          try {
            const refQuery = query(collection(db, 'users'), where('referralCode', '==', regReferralCode.value));
            const refSnap = await getDocs(refQuery);
            if (!refSnap.empty) {
              const referrerId = refSnap.docs[0].id;
              const refDocRef = doc(db, 'referrals', referrerId);
              const refDoc = await getDoc(refDocRef);
              if (refDoc.exists()) { await updateDoc(refDocRef, { totalRefs: increment(1) }); }
              else { await setDoc(refDocRef, { totalRefs: 1, totalEarned: 0 }); }
            }
          } catch (re) {}
        }
        localStorage.setItem('userId', uid);
        window.location.href = 'index.html';
      } catch (e) {
        if (e.code === 'auth/email-already-in-use') errorMsg.value = 'Email already in use!';
        else errorMsg.value = 'Registration failed: ' + e.message;
      } finally { regLoading.value = false; }
    };

    return { regName, regPhone, regEmail, regPass, regConfirm, regReferralCode, regLoading, errorMsg, handleGoogleLogin, handleRegister };
  }
}).mount('#app');
</script>
</body>
</html>
