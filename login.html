<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0, viewport-fit=cover">
<title>Login — H24 ONLINE</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app" v-cloak>
  <div id="app" style="max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);">
    <div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;">
      <div style="text-align:center;margin-bottom:32px;">
        <div style="width:60px;height:60px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;margin:0 auto 16px;">H</div>
        <div style="font-size:26px;font-weight:900;margin-bottom:4px;">H24 <span class="gradient-text">ONLINE</span></div>
        <div style="font-size:14px;color:var(--text-muted);">Login to continue</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:20px;">
        <button @click="handleGoogleLogin" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:#fff;font-size:14px;font-weight:600;margin-bottom:20px;" class="card-hover">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" style="width:20px;"> Login with Google
        </button>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <div style="flex:1;height:1px;background:var(--border);"></div>
          <span style="font-size:12px;color:var(--text-dim);">or with credentials</span>
          <div style="flex:1;height:1px;background:var(--border);"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <input v-model="loginEmail" type="email" class="input-field" placeholder="Email address">
          <input v-model="loginPass" type="password" class="input-field" placeholder="Password">
        </div>
        <div style="text-align:right;margin:10px 0 20px;">
          <span style="font-size:12px;color:var(--primary);font-weight:600;cursor:pointer;">Forgot Password?</span>
        </div>
        <div v-if="errorMsg" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:12px;padding:12px;font-size:13px;color:#f87171;margin-bottom:14px;">{{ errorMsg }}</div>
        <button @click="handleEmailLogin" class="btn-primary" style="width:100%;" :disabled="loginLoading">
          <span v-if="loginLoading" class="spinner"></span>
          <span v-else>Login</span>
        </button>
        <p style="text-align:center;font-size:13px;color:var(--text-muted);margin-top:16px;">
          New user? <a href="register.html" style="color:var(--primary);font-weight:700;text-decoration:none;">Register Now</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { createApp, ref } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

const firebaseConfig = {
  apiKey: "AIzaSyCZWRcCP0hXTkfQoRhqxczgdD6cw5kp39c",
  authDomain: "h24-online.firebaseapp.com",
  projectId: "h24-online",
  storageBucket: "h24-online.firebasestorage.app",
  messagingSenderId: "808524719613",
  appId: "1:808524719613:web:7f1abe9e70a346c3376594"
};
const fireApp = initializeApp(firebaseConfig);
const auth = getAuth(fireApp);
setPersistence(auth, browserLocalPersistence).catch(() => {});
const db = getFirestore(fireApp);

createApp({
  setup() {
    const loginEmail = ref('');
    const loginPass = ref('');
    const loginLoading = ref(false);
    const errorMsg = ref('');

    const handleGoogleLogin = async () => {
      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const userRef = doc(db, 'users', user.uid);
        const snap = await getDoc(userRef);
        if (!snap.exists()) {
          await setDoc(userRef, {
            uid: user.uid, name: user.displayName||'User', email: user.email,
            photoURL: user.photoURL||'', balance: 0, phone: '',
            referralCode: user.uid.substring(0, 8), joinedAt: new Date().toISOString()
          });
        }
        await updateDoc(doc(db, 'users', user.uid), { lastSeen: serverTimestamp(), isOnline: true }).catch(()=>{});
        localStorage.setItem('userId', user.uid);
        window.location.href = 'index.html';
      } catch (e) { errorMsg.value = 'Google login failed: ' + e.message; }
    };

    const handleEmailLogin = async () => {
      if (!loginEmail.value || !loginPass.value) { errorMsg.value = 'Email ও Password দিন।'; return; }
      loginLoading.value = true; errorMsg.value = '';
      try {
        const result = await signInWithEmailAndPassword(auth, loginEmail.value, loginPass.value);
        await updateDoc(doc(db, 'users', result.user.uid), { lastSeen: serverTimestamp(), isOnline: true }).catch(()=>{});
        localStorage.setItem('userId', result.user.uid);
        window.location.href = 'index.html';
      } catch (e) { errorMsg.value = 'Invalid email or password!'; }
      finally { loginLoading.value = false; }
    };

    return { loginEmail, loginPass, loginLoading, errorMsg, handleGoogleLogin, handleEmailLogin };
  }
}).mount('#app');
</script>
</body>
</html>
