<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0, viewport-fit=cover">
  <title>H24ONLINE - Login</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* ── লগইন পেজ স্পেসিফিক ── */
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    a, button, div[onclick] { touch-action: manipulation; }
    body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      font-family: 'Outfit', 'Noto Sans Bengali', sans-serif;
      background: #0a0a0f;
      color: #fff;
      overflow-x: hidden;
    }
    :root {
      --primary: #6c63ff;
      --primary-dark: #4c44cc;
      --accent: #ff6b9d;
      --gold: #ffd700;
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1c1c28;
      --surface3: #252535;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --text-muted: #8888a8;
      --text-dim: #555570;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
    }
    [v-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 0; height: 0; }

    /* গ্রেডিয়েন্ট টেক্সট */
    .gradient-text {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* লোগো গ্লো */
    .logo-glow {
      box-shadow: 0 0 32px rgba(108,99,255,0.35), 0 0 8px rgba(108,99,255,0.2);
    }

    /* ইনপুট ফিল্ড */
    .input-field {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 16px 13px 44px;
      width: 100%;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }
    .input-field::placeholder { color: var(--text-muted); }

    /* প্রাইমারি বাটন */
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:disabled {
      background: #2a2a40;
      color: var(--text-dim);
      cursor: not-allowed;
    }

    /* গুগল বাটন */
    .btn-google {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 24px;
      font-family: inherit;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .btn-google:active { transform: scale(0.97); background: var(--surface3); }

    /* কার্ড */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px 20px;
    }

    /* ডিভাইডার */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ইনপুট র‍্যাপার */
    .input-wrap { position: relative; }
    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
    }
    .input-wrap .eye-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
      padding: 4px;
    }

    /* সোশ্যাল আইকন */
    .social-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .social-btn:active { transform: scale(0.9); }

    /* ব্যাকগ্রাউন্ড ইফেক্ট */
    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow-1 {
      width: 280px; height: 280px;
      background: rgba(108,99,255,0.12);
      top: -80px; left: -60px;
    }
    .bg-glow-2 {
      width: 220px; height: 220px;
      background: rgba(255,107,157,0.08);
      bottom: 80px; right: -60px;
    }

    /* স্পিনার */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* টোস্ট */
    .toast-msg {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30,30,46,0.97);
      border: 1px solid rgba(108,99,255,0.35);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 40px;
      white-space: nowrap;
      z-index: 9999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-msg.error { border-color: rgba(239,68,68,0.4); }
  </style>
</head>
<body>

<!-- ব্যাকগ্রাউন্ড গ্লো ইফেক্ট -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div id="app" v-cloak style="max-width:430px;margin:0 auto;min-height:100vh;position:relative;background:transparent;z-index:1;">

  <!-- ── পেজ র‍্যাপার ── -->
  <div class="flex flex-col justify-between min-h-screen px-5 py-6">

    <!-- ── লোগো সেকশন ── -->
    <div class="flex flex-col items-center pt-10 pb-2">
      <!-- লোগো আইকন -->
      <div class="logo-glow mb-5" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:32px;font-weight:900;color:#fff;letter-spacing:-1px;">H</span>
      </div>
      <!-- অ্যাপ নাম -->
      <div class="text-center mb-2">
        <div style="font-size:26px;font-weight:900;letter-spacing:1px;" class="gradient-text">H24ONLINE</div>
        <div style="font-size:11px;color:var(--text-muted);letter-spacing:3px;font-weight:600;margin-top:2px;">YOUR GAMING PARTNER</div>
      </div>
      <div class="mt-4 text-center">
        <div style="font-size:20px;font-weight:700;color:var(--text);">Welcome Back 👋</div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:4px;">আপনার অ্যাকাউন্টে লগইন করুন</div>
      </div>
    </div>

    <!-- ── লগইন কার্ড ── -->
    <div class="login-card my-6">

      <!-- গুগল লগইন বাটন -->
      <button @click="handleGoogleLogin" :disabled="loading" class="btn-google mb-2">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" style="width:20px;height:20px;" alt="Google">
        <span>Google দিয়ে লগইন করুন</span>
      </button>

      <!-- ডিভাইডার -->
      <div class="divider">অথবা ইমেইল দিয়ে</div>

      <!-- ইমেইল ও পাসওয়ার্ড ফর্ম -->
      <div class="space-y-4">

        <!-- ইমেইল -->
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:0.5px;display:block;margin-bottom:7px;text-transform:uppercase;">ইমেইল</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input
              type="email"
              v-model="email"
              placeholder="আপনার ইমেইল লিখুন"
              class="input-field"
              autocomplete="email"
            >
          </div>
        </div>

        <!-- পাসওয়ার্ড -->
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:0.5px;display:block;margin-bottom:7px;text-transform:uppercase;">পাসওয়ার্ড</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              :type="showPass ? 'text' : 'password'"
              v-model="password"
              placeholder="আপনার পাসওয়ার্ড লিখুন"
              class="input-field"
              style="padding-right:44px;"
              autocomplete="current-password"
            >
            <span class="eye-toggle" @click="showPass = !showPass">
              <i :class="showPass ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
            </span>
          </div>
        </div>

        <!-- পাসওয়ার্ড ভুলে গেছেন -->
        <div class="flex justify-end" style="margin-top:-4px;">
          <a href="#" style="font-size:12px;font-weight:600;color:var(--primary);text-decoration:none;">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>

        <!-- লগইন বাটন -->
        <button
          @click="handleEmailLogin"
          :disabled="loading"
          class="btn-primary w-full flex items-center justify-center gap-2"
          style="width:100%;"
        >
          <span v-if="loading" class="spinner"></span>
          <span v-else><i class="fa-solid fa-right-to-bracket mr-2"></i>লগইন করুন</span>
        </button>

      </div>

      <!-- রেজিস্টার লিংক -->
      <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted);">
        নতুন ইউজার?
        <a href="register.html" style="color:var(--primary);font-weight:700;text-decoration:none;margin-left:4px;">এখনই রেজিস্ট্রেশন করুন →</a>
      </div>

    </div>

    <!-- ── ফুটার ── -->
    <div style="text-align:center;padding-bottom:16px;">
      <div style="font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;">সোশ্যাল মিডিয়া</div>
      <div class="flex justify-center gap-3 mb-4">
        <a href="#" class="social-btn" style="background:rgba(59,130,246,0.12);color:#3b82f6;">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="#" class="social-btn" style="background:rgba(14,165,233,0.12);color:#0ea5e9;">
          <i class="fa-brands fa-telegram"></i>
        </a>
        <a href="#" class="social-btn" style="background:rgba(239,68,68,0.12);color:#ef4444;">
          <i class="fa-brands fa-youtube"></i>
        </a>
        <a href="#" class="social-btn" style="background:rgba(168,85,247,0.12);color:#a855f7;">
          <i class="fa-brands fa-discord"></i>
        </a>
      </div>
      <div style="font-size:10px;color:var(--text-dim);">© H24ONLINE 2026 · সর্বস্বত্ব সংরক্ষিত</div>
    </div>

  </div>

  <!-- টোস্ট মেসেজ -->
  <div class="toast-msg" :class="[toast.show ? 'show' : '', toast.type === 'error' ? 'error' : '']">
    {{ toast.msg }}
  </div>

</div>

<!-- Vue & Firebase লজিক -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { createApp, ref } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

  const firebaseConfig = {
    apiKey: "AIzaSyACUK207BRvtR5yc1UhYLS9FlMitVVlrrE",
    authDomain: "freetopup-fd263.firebaseapp.com",
    projectId: "freetopup-fd263",
    storageBucket: "freetopup-fd263.firebasestorage.app",
    messagingSenderId: "756173302110",
    appId: "1:756173302110:web:14227664f6b5d14d9047cf"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const auth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);

  createApp({
    setup() {
      const email    = ref('');
      const password = ref('');
      const loading  = ref(false);
      const showPass = ref(false);
      const toast    = ref({ show: false, msg: '', type: 'success' });

      let toastTimer = null;
      const showToast = (msg, type = 'success') => {
        if (toastTimer) clearTimeout(toastTimer);
        toast.value = { show: true, msg, type };
        toastTimer = setTimeout(() => { toast.value.show = false; }, 2800);
      };

      /* ── গুগল লগইন ── */
      const handleGoogleLogin = async () => {
        if (loading.value) return;
        loading.value = true;
        try {
          const provider = new GoogleAuthProvider();
          const result   = await signInWithPopup(auth, provider);
          const user     = result.user;

          const userRef  = doc(db, 'users', user.uid);
          const userSnap = await getDoc(userRef);

          if (!userSnap.exists()) {
            await setDoc(userRef, {
              uid:       user.uid,
              name:      user.displayName || 'User',
              email:     user.email,
              photoURL:  user.photoURL || 'https://i.pravatar.cc/150?img=12',
              balance:   0,
              phone:     '',
              joinedAt:  new Date().toISOString()
            });
          }

          localStorage.setItem('userId', user.uid);
          showToast('✅ লগইন সফল! রিডাইরেক্ট হচ্ছে...');
          setTimeout(() => { window.location.href = 'index.html'; }, 800);

        } catch (err) {
          console.error('Google Login Error:', err);
          showToast('❌ Google লগইন ব্যর্থ হয়েছে!', 'error');
        } finally {
          loading.value = false;
        }
      };

      /* ── ইমেইল লগইন ── */
      const handleEmailLogin = async () => {
        if (!email.value || !password.value) {
          showToast('⚠️ ইমেইল ও পাসওয়ার্ড দিন!', 'error');
          return;
        }
        loading.value = true;
        try {
          const credential = await signInWithEmailAndPassword(auth, email.value, password.value);
          localStorage.setItem('userId', credential.user.uid);
          showToast('✅ লগইন সফল! রিডাইরেক্ট হচ্ছে...');
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        } catch (err) {
          console.error('Login Error:', err);
          showToast('❌ ইমেইল বা পাসওয়ার্ড ভুল!', 'error');
        } finally {
          loading.value = false;
        }
      };

      return {
        email, password, loading, showPass, toast,
        handleGoogleLogin, handleEmailLogin
      };
    }
  }).mount('#app');
</script>
</body>
</html>
